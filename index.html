const avg=id=>{const s=STAT[id];return s?{n:s.n,a:s.a}:{n:0,a:0}};
const posOpts=()=>{const g={};POS.forEach((p,i)=>(g[p[1]]=g[p[1]]||[]).push(i));return Object.keys(g).map(d=>`<optgroup label="${d}">${g[d].map(i=>`<option value="${i}">${POS[i][0]}</option>`).join('')}</optgroup>`).join('')};

const stTag=(t,l)=>{const m={doing:'กำลังทำ',review:'รอตรวจ',redo:t.verdict=='fail'?'ไม่ผ่าน':'ขอแก้ไข',done:'ผ่านแล้ว ✔'};return(t.rid?'<span class="tag">🔁 ประจำ</span>':'')+(t.pri=='urgent'?'<span class="tag" style="background:var(--bad);color:#fff">ด่วน</span>':'')+(l?'<span class="late">เลยกำหนด</span>':'')+`<span class="tag">${m[t.st]||''}</span>`};

const msgFollow=t=>`สวัสดี คุณ${nm(t.to)} 🌿 ขอติดตามงาน “${t.t}” หน่อยนะ กำหนดส่ง ${t.due||'-'} ตอนนี้คืบหน้าไปถึงไหนแล้ว? ถ้าติดตรงไหนบอกได้เลย ทีมพร้อมช่วยกัน — ${nm(t.from)}`;
const msgBite=t=>`สวัสดี คุณ${nm(t.to)} 🐜 งาน “${t.t}” เลยกำหนดมา ${dlate(t)} วันแล้ว ขอกัดเบา ๆ เป็นการเตือนนิดนึงนะ รบกวนแจ้งสถานะวันนี้ได้ไหม ถ้าต้องการให้ช่วยบอกได้เลย — ${nm(t.from)}`;
const msgSubmit=t=>`สวัสดี คุณ${nm(t.from)} 🌿 ส่งงาน “${t.t}” เรียบร้อยแล้ว รบกวนช่วยตรวจรับด้วยนะ ขอบคุณมาก — ${nm(t.to)}`;
const openLine=m=>window.open('https://line.me/R/msg/text/?'+encodeURIComponent(m),'_blank');
const fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const recTxt=r=>r.freq=='week'?'ทุกวัน'+DOW[r.dow]:r.dom==0?'ทุกสิ้นเดือน':'ทุกวันที่ '+r.dom+' ของเดือน';
function dueDates(r,a,b){const o=[];for(const d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const ok=r.freq=='week'?d.getDay()==r.dow:r.dom==0?d.getDate()==dim(d.getFullYear(),d.getMonth()):d.getDate()==Math.min(r.dom,dim(d.getFullYear(),d.getMonth()));if(ok)o.push(fmt(d))}return o}
const freqUI=()=>{const f=V('af');$('fw').style.display=f=='week'?'':'none';$('fm').style.display=f=='month'?'':'none';$('fo').style.display=f=='once'?'':'none'};
const recList=()=>{const l=Object.values(RC).filter(r=>r.from==ME);return l.length?`<h2>งานประจำที่ตั้งไว้</h2>`+l.map(r=>`<div class="card task"><div><b>${esc(r.t)}</b><small>${recTxt(r)} · ${r.to.map(k=>esc(nm(k))).join(', ')}${r.pri=='urgent'?' · ด่วน':''}</small></div><div class="row"><span class="tag">${r.on?'ทำงานอยู่':'หยุดชั่วคราว'}</span><button onclick="togR('${r.id}')">${r.on?'หยุด':'เปิดต่อ'}</button><button class="bad" onclick="delR('${r.id}')">ลบ</button></div></div>`).join(''):''};

async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:V('em'),password:$('pw').value});if(error)toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง')}
async function doReg(){const n=V('rn'),em=V('em'),pw=$('pw').value;if(!n||!em)return toast('กรอกชื่อและอีเมลให้ครบ');if(pw.length<6)return toast('รหัสผ่านอย่างน้อย 6 ตัวอักษร');if(pw!=$('pw2').value)return toast('รหัสผ่านสองช่องไม่ตรงกัน');const p=POS[+V('rp')],{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name:n,pos:p[0],dept:p[1],line:V('rl')},emailRedirectTo:location.origin}});if(error)return toast(error.message);if(!data.session){mode='login';render();toast('ส่งอีเมลยืนยันแล้ว กดลิงก์ในอีเมลก่อนเข้าสู่ระบบ')}}
async function doForgot(){const em=V('em');if(!em)return toast('ใส่อีเมลก่อนนะ');await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});mode='login';render();toast('ส่งลิงก์ตั้งรหัสใหม่ไปที่อีเมลแล้ว (ถ้ามีบัญชีนี้)')}
async function doRecov(){const a=$('pw').value;if(a.length<6)return toast('รหัสผ่านอย่างน้อย 6 ตัวอักษร');if(a!=$('pw2').value)return toast('รหัสผ่านสองช่องไม่ตรงกัน');const {error}=await sb.auth.updateUser({password:a});if(error)return toast(error.message);recov=false;render();toast('ตั้งรหัสผ่านใหม่แล้ว')}
const logout=()=>sb.auth.signOut();
async function chPw(){const a=$('pn').value;if(a.length<6)return toast('รหัสใหม่อย่างน้อย 6 ตัวอักษร');if(a!=$('pn2').value)return toast('รหัสใหม่สองช่องไม่ตรงกัน');const {error}=await sb.auth.updateUser({password:a});if(error)return toast(error.message);$('pn').value=$('pn2').value='';toast('เปลี่ยนรหัสผ่านแล้ว')}

async function doAssign(){const t=V('at'),ids=[...document.querySelectorAll('.asg:checked')].map(x=>x.value);if(!t||!ids.length)return toast('ใส่ชื่องานและเลือกผู้รับอย่างน้อย 1 คน');const f=V('af'),d=V('ad'),pri=V('ap');
if(f&&f!='once'){const o={title:t,descr:d,from_id:ME,to_ids:ids,pri,freq:f,dow:+V('adw'),dom:+V('adm'),start:today()};if(!await Q(sb.from('recurs').insert(o)))return;await sb.rpc('generate_recurring');await Promise.all([loadR(),loadT()]);page='dash';render();toast('ตั้งงานประจำแล้ว: '+recTxt({freq:f,dow:o.dow,dom:o.dom}));return}
const gid='g'+Date.now().toString(36),due=V('adu')||null;if(!await Q(sb.from('tasks').insert(ids.map(to=>({title:t,descr:d,from_id:ME,to_id:to,due,pri,gid})))))return;await loadT();page='dash';render();toast(`มอบหมายแล้ว ${ids.length} คน`)}
const setP=async(id,v)=>{if(await Q(sb.from('tasks').update({prog:+v}).eq('id',id)))refresh()};
const addCm=(id,tx)=>Q(sb.from('task_comments').insert({task_id:id,by_id:ME,tx}));
async function addC(id){const v=V('cmi');if(!v)return toast('พิมพ์ข้อความก่อนนะ');if(await addCm(id,v))await loadC(id,1)}
async function subm(id){const t=TK[id],via=V('sv'),m=msgSubmit(t),c=V('cmi');if(via=='line')openLine(m);else window.open('mailto:?subject='+encodeURIComponent('ส่งงาน: '+t.t)+'&body='+encodeURIComponent(m));if(c)await addCm(id,c);if(await Q(sb.from('tasks').update({st:'review',prog:100,sub:{via,at:today()+' '+hm()}}).eq('id',id))){await loadC(id);await refresh();toast('ส่งงานให้ตรวจแล้ว 🎉')}}
async function verd(id,v){const t=TK[id],c=V('cmi'),o={sweet:rt||null};if(v==1){o.st='done';o.prog=100;o.verdict=null}else{o.st='redo';o.verdict=v==2?'fix':'fail';o.prog=Math.min(t.prog,90)}if(c)await addCm(id,c);if(await Q(sb.from('tasks').update(o).eq('id',id))){rt=0;await loadC(id);await refresh();toast(v==1?'ผ่านแล้ว 🎉':'ส่งกลับให้แก้ไขแล้ว')}}
async function bite(id){const t=TK[id];if(!late(t))return toast('งานนี้ยังไม่เลยกำหนด ใช้ปุ่มตามงานทาง LINE แทนนะ');openLine(msgBite(t));if(await Q(sb.from('tasks').update({bites:(t.bites||0)+1}).eq('id',id))){await refresh();toast('กัดแล้ว! 🐜')}}
const line=id=>openLine(msgFollow(TK[id]));

const togR=async id=>{if(await Q(sb.from('recurs').update({active:!RC[id].on}).eq('id',id))){await loadR();render()}};
const delR=async id=>{if(await Q(sb.from('recurs').delete().eq('id',id))){await loadR();render()}};
const addN=async()=>{const v=V('nt');if(!v)return toast('พิมพ์สิ่งที่ต้องทำก่อนนะ');if(await Q(sb.from('notes').insert({tx:v,tm:V('ntm')||null,date:today()}))){await loadNotes();render()}};

const delN=async id=>{if(await Q(sb.from('notes').delete().eq('id',id))){await loadNotes();render()}};

async function readAll(){await Q(sb.from('notifs').update({read:true}).eq('to_id',ME).eq('read',false));await loadN();render()}

const mv=d=>{cmo+=d;if(cmo<0){cmo=11;cy--}if(cmo>11){cmo=0;cy++}render()};

// ---------- views ----------
function taskRow(t,mine){const l=late(t),o=mine?t.from:t.to;return `<div class="card"><div class="task"><div><b>${esc(t.t)}</b>${t.d?`<small>${esc(t.d)}</small>`:''}<small>${mine?'จาก ':'ถึง '}${esc(nm(o))} · กำหนด ${esc(t.due||'-')}${t.bites?' · ถูกกัด '+t.bites+' ครั้ง':''}</small></div><div class="row">${stTag(t,l)}</div></div><div class="bar" style="margin-top:10px"><i style="width:${t.prog}%"></i></div><div class="row" style="margin-top:10px"><button class="p" onclick="openT('${t.id}')">${mine?(t.st=='done'?'ดูงาน':'อัปเดต / ส่งงาน'):(t.st=='review'?'🔍 ตรวจงาน':'ดูงาน')}</button>${!mine&&t.st!='done'?`<button class="${l?'bad':''}" onclick="bite('${t.id}')">${ant(22)} กัด!</button><button onclick="line('${t.id}')">💬 ตามงานทาง LINE</button>`:''}</div></div>`}
function dash(){const A=Object.values(TK),m=A.filter(t=>t.to==ME),o=A.filter(t=>t.from==ME),op=x=>x.filter(t=>t.st!='done').length,so=(a,b)=>(a.st=='done')-(b.st=='done')||(b.pri=='urgent')-(a.pri=='urgent')||(a.due||'').localeCompare(b.due||''),rv=o.filter(t=>t.st=='review').length,rw=(x,f)=>x.sort(so).map(t=>taskRow(t,f)).join('');return `<div class="stats"><div class="stat"><b>${op(m)}</b><span>งานของฉันที่ค้าง</span></div><div class="stat"><b>${op(o)}</b><span>งานที่มอบไป</span></div><div class="stat"><b style="color:var(--bad)">${o.filter(late).length}</b><span>ส่งช้า</span></div></div>${rv?`<div class="card" style="background:var(--br2)">🔍 มีงานรอตรวจรับ ${rv} งาน</div>`:''}<h2>งานของฉัน</h2>${m.length?rw(m,1):'<div class="empty">ยังไม่มีงานที่ได้รับ</div>'}<h2>งานที่ฉันมอบหมาย</h2>${o.length?rw(o,0):'<div class="empty">ยังไม่ได้มอบหมายงานให้ใคร</div>'}`}
function taskV(){const t=TK[cur];if(!t)return '<div class="card empty">ไม่พบงาน</div>';const mine=t.to==ME,boss=t.from==ME,p=t.prog,can=mine&&(t.st=='doing'||t.st=='redo');let h=`<button onclick="go('dash')">← กลับ</button><div class="card" style="margin-top:12px"><div class="task"><div><b style="font-size:18px">${esc(t.t)}</b>${t.d?`<small>${esc(t.d)}</small>`:''}<small>จาก ${esc(nm(t.from))} → ${esc(nm(t.to))} · กำหนด ${esc(t.due||'-')}</small></div><div class="row">${stTag(t,late(t))}</div></div><div class="trk"><div class="w" style="left:${p}%;transform:translateX(-${p}%)"><div class="bob"><span class="veg">${VEG[(t.at||0)%VEG.length]}</span>${ant(44,(P[t.to]||{}).av)}</div></div><span class="goal">🏠</span></div><div style="text-align:center"><b>${p}%</b>${p==100?' 🎉':''}</div>`;
if(can)h+=`<label>เลื่อนเพื่ออัปเดตความคืบหน้า</label><input type="range" min="0" max="100" step="5" value="${p}" style="padding:0" onchange="setP('${t.id}',this.value)"><label>ส่งงานผ่านช่องทาง</label><select id="sv"><option value="line">LINE</option><option value="email">อีเมล</option></select><button class="ok" onclick="subm('${t.id}')">ส่งงานให้ตรวจ ✔</button>`;
if(t.verdict&&t.st=='redo')h+=`<p class="late">${t.verdict=='fail'?'งานไม่ผ่าน':'ขอให้แก้ไข'} ดูคอมเมนต์ด้านล่าง แล้วส่งใหม่ได้เลย</p>`;
if(t.st=='review')h+=`<p>📨 ส่งแล้วทาง ${t.sub&&t.sub.via=='email'?'อีเมล':'LINE'} เมื่อ ${esc(t.sub?t.sub.at:'')}${mine?' · รอผู้มอบหมายตรวจ':''}</p>`;
if(t.sweet>0)h+=`<div class="row" style="align-items:center">น้ำหวานที่ได้ ${drops(t.sweet)}</div>`;h+='</div>';
if(boss&&t.st=='review')h+=`<div class="card" style="background:var(--br2)"><b>ตรวจรับงาน</b><label>ให้น้ำหวานตามความพอใจ (ไม่บังคับ)</label><div class="row" style="margin-bottom:12px">${[1,2,3,4,5].map(i=>`<button style="padding:4px 6px;border:0;background:none" onclick="rt=${rt==i?0:i};render()">${drop(i<=rt)}</button>`).join('')}</div><div class="row"><button class="ok" onclick="verd('${t.id}',1)">✔ ผ่าน</button><button onclick="verd('${t.id}',2)">✏️ ขอให้แก้ไข</button><button class="bad" onclick="verd('${t.id}',3)">✖ ไม่ผ่าน</button></div></div>`;
